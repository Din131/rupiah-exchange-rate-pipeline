name: Daily load

on:
  schedule:
    # 23:17 UTC Mon–Fri = 06:17 WIB Tue–Sat, after the ECB publishes each business day's rates.
    - cron: "17 23 * * 1-5"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Reload the full history from 2015"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-load
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Run pipeline
        run: |
          if [ "${{ inputs.full_refresh }}" = "true" ]; then
            python -m pipeline.run --full-refresh
          else
            python -m pipeline.run
          fi

      - name: Commit new data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: load rates up to $(date -u +%Y-%m-%d)"
            git push
          fi
